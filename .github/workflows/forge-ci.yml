name: Forge CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  forge-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run project checks
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            corepack enable
            pnpm install --frozen-lockfile
            pnpm lint
            pnpm test
            pnpm build
          elif [ -f Cargo.toml ]; then
            cargo fmt --check
            cargo test
          else
            # Keep repository-wide checks topic-agnostic; task-specific content is verified by the task workflow.
            if [ ! -f article.txt ]; then
              echo "Expected article.txt for this plain-text repository."
              exit 1
            fi

            if ! grep -Eq '[^[:space:]]' article.txt; then
              echo "article.txt must contain non-whitespace content."
              exit 1
            fi
          fi
